<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#151515">
  <title>DrawCraft</title>
  <link rel="stylesheet" href="src/style.css">
</head>
<body>
<div id="app">
  <aside class="sidebar" aria-label="Nástroje">
    <button class="icon-btn menu-btn" id="menuBtn" title="Menu" aria-label="Menu">☰</button>
    <div class="tool-group">
      <button class="icon-btn active" data-tool="select" title="Výběr" aria-label="Výběr">↖</button>
      <button class="icon-btn" data-tool="brush" title="Štětec" aria-label="Štětec">╱</button>
      <button class="icon-btn" data-tool="eraser" title="Guma" aria-label="Guma">▱</button>
      <button class="icon-btn" data-tool="eyedropper" title="Kapátko" aria-label="Kapátko">⌾</button>
      <button class="icon-btn" data-tool="shape" title="Tvary" aria-label="Tvary">○□△</button>
      <button class="icon-btn" data-tool="text" title="Text" aria-label="Text">T</button>
      <button class="icon-btn" data-tool="layers" title="Vrstvy" aria-label="Vrstvy">▱</button>
    </div>
    <button class="icon-btn settings" id="settingsBtn" title="Nastavení" aria-label="Nastavení">⚙</button>
  </aside>

  <main class="workspace">
    <header class="topbar">
      <div class="top-left"><button class="top-btn" id="undoBtn">↶</button><button class="top-btn" id="redoBtn">↷</button></div>
      <div class="zoom"><button class="top-btn" id="zoomOut">−</button><span id="zoomLabel">100%</span><button class="top-btn" id="zoomIn">＋</button></div>
      <div class="top-right"><button class="color-chip" id="colorBtn" aria-label="Barva"></button><button class="top-btn" id="layersBtn">▱</button><button class="top-btn" id="fitBtn">⌗</button></div>
    </header>

    <section class="canvas-wrap" id="canvasWrap">
      <canvas id="canvas" aria-label="Kreslicí plátno"></canvas>
      <div class="empty-hint" id="emptyHint">Začni kreslit nebo přidej geometrický tvar</div>
      <div class="shape-popover hidden" id="shapePopover">
        <button data-shape="rect">Obdélník</button><button data-shape="circle">Kruh</button><button data-shape="triangle">Trojúhelník</button><button data-shape="line">Čára</button><button data-shape="star">Hvězda</button>
      </div>
    </section>

    <footer class="statusbar"><span id="modeLabel">Výběr</span><span id="canvasInfo">Plátno 1200 × 800</span><span id="selectionInfo">Nic nevybráno</span></footer>
  </main>

  <aside class="properties" id="properties">
    <div class="panel-head"><strong>Vlastnosti</strong><button id="closeProperties">×</button></div>
    <div id="propertyContent"><p class="muted">Vyber objekt.</p></div>
  </aside>
</div>

<div class="modal hidden" id="menuModal" role="dialog" aria-modal="true">
  <div class="menu-panel">
    <div class="menu-head"><span>Menu</span><button id="closeMenu">×</button></div>
    <button class="menu-item" data-action="new"><span class="menu-icon">＋</span><span><b>Nový</b><small>Krátká reklama</small></span><i>›</i></button>
    <button class="menu-item" data-action="3d"><span class="menu-icon">◇</span><span><b>3D kresba</b><small>Krátká reklama</small></span><i>›</i></button>
    <button class="menu-item" data-action="convert"><span class="menu-icon">□→◇</span><span><b>2D → 3D</b><small>Krátká reklama</small></span><i>›</i></button>
    <div class="menu-divider"></div>
    <button class="menu-link" data-action="palette">Barevná paleta</button>
    <button class="menu-link" data-action="export">Export PNG</button>
  </div>
</div>

<div class="modal hidden" id="adModal"><div class="ad-box"><button class="modal-close" id="closeAd">×</button><p>Krátká reklama</p><div class="ad-placeholder">REKLAMA</div><button class="primary" id="continueAd">Pokračovat</button></div></div>
<div class="modal hidden" id="threeModal"><div class="three-panel"><div class="menu-head"><span>3D kresba</span><button id="close3d">×</button></div><div class="three-toolbar"><button data-primitive="cube">Krychle</button><button data-primitive="cuboid">Kvádr</button><button data-primitive="sphere">Koule</button><button data-primitive="cylinder">Válec</button><button data-primitive="cone">Kužel</button></div><canvas id="threeCanvas"></canvas><div class="three-status" id="threeStatus">Objekt: Krychle · přetáhni myší nebo prstem</div></div></div>
<div class="modal hidden" id="paletteModal"><div class="palette-panel"><div class="menu-head"><span>Paleta</span><button id="closePalette">×</button></div><div id="palettes"></div><label class="custom-color">Vlastní barva <input type="color" id="customColor" value="#222222"></label></div></div>
<script src="src/app.js"></script>
</body>
</html>
